name: Copilot Agent Setup

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      # Add pages and id-token permissions ONLY if you are deploying a Pages site
      pages: write      
      id-token: write   

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Upgraded Node setup to use Node 24
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' 

      - name: Install Dependencies
        run: npm ci

      # ONLY include this block if you verified the GitHub Pages setting above
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5 
